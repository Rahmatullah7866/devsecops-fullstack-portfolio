name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality, SAST & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Linting (Flake8)
        run: |
          cd backend
          # Stop build if there are syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Static Security Analysis (Bandit SAST)
        run: |
          cd backend
          bandit -r core notes -ll

      - name: Dependency Vulnerability Audit (SCA)
        run: |
          cd backend
          pip-audit

      - name: Run Tests with Pytest & Coverage
        run: |
          cd backend
          coverage run -m pytest
          coverage report -m --fail-under=70

  container-security:
    name: Docker Build & Vulnerability Scanning
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t secure-notes-backend:${{ github.sha }} backend/

      - name: Scan Image with Trivy (Fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-notes-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
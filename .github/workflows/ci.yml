name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend SAST & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd backend
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          pip install -r requirements.txt
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          bandit -r core notes -ll
          pip-audit
          coverage run -m pytest
          coverage report -m --fail-under=70

  frontend-checks:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd frontend
          npm install
          npm test -- --watchAll=false

  dast-scan:
    name: Dynamic App Security Testing (OWASP ZAP)
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Build & Run Services
        run: |
          docker compose up -d --build
          sleep 10
          curl --fail http://localhost:8000/api/notes/ || exit 1

      - name: Run OWASP ZAP Baseline DAST
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:8000/api/notes/'
          fail_action: false
          allow_issue_writing: false